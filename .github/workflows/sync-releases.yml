name: Sync Weekly Releases

on:
  schedule:
    # Jeudi 18h UTC = Jeudi 19h/20h heure française (été/hiver)
    - cron: '0 18 * * 4'
  workflow_dispatch: # Permet lancement manuel

permissions:
  contents: read
  issues: write

jobs:
  sync:
    name: Sync releases from MusicBrainz/Last.fm/Spotify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      MUSICBRAINZ_USER_AGENT: BARZ/1.0 (${{ secrets.MUSICBRAINZ_EMAIL || 'github-actions@barz.app' }})
      LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
      SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run sync script
        run: npm run sync:releases
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MUSICBRAINZ_USER_AGENT: BARZ/1.0 (${{ secrets.MUSICBRAINZ_EMAIL || 'github-actions@barz.app' }})
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Sync releases failed',
              body: `The weekly releases sync workflow failed. Check the logs: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['bug', 'sync', 'automated']
            })