name: Sync Releases

on:
  # Synchro de minuit (heure de Paris) : lancée à l'heure par Supabase (pg_cron → fonction sync-fresh, mode minuit),
  # car les tâches programmées de GitHub partent avec des heures de retard. Dans la journée, la veille de sync-fresh
  # (toutes les 5 min) prend les nouvelles sorties des artistes les plus suivis.
  schedule:
    # Lundi et vendredi à 6h UTC (7h/8h en France) : catalogue d'artistes, puis sorties ajoutées en retard par Deezer
    - cron: '0 6 * * 1,5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'manuel : reconstruit aussi le catalogue ; minuit : sorties seulement (lancé par Supabase)'
        type: choice
        options: [manuel, minuit]
        default: manuel

permissions:
  contents: read
  issues: write

jobs:
  sync:
    name: Sync releases (Deezer + Spotify)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
      SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
      # Appli Spotify dédiée à la synchro : coupée (bloquée 13 h dès le premier passage le 28/10/2026)
      SYNC_SPOTIFY: '0'
      SPOTIFY_SYNC_CLIENT_ID: ${{ secrets.SPOTIFY_SYNC_CLIENT_ID }}
      SPOTIFY_SYNC_CLIENT_SECRET: ${{ secrets.SPOTIFY_SYNC_CLIENT_SECRET }}
      # Contact demandé par MusicBrainz (annonces de sorties à venir)
      MUSICBRAINZ_USER_AGENT: BARZ/1.0 (${{ secrets.MUSICBRAINZ_EMAIL || 'https://albannnnnnnnnn.github.io/BARZ-/' }})
      # Import Last.fm des membres (sync:artists) ; reste côté serveur
      LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Day of week
        id: day
        run: echo "day=$(date -u +%a)" >> "$GITHUB_OUTPUT"

      # Catalogue d'artistes, artistes similaires et import Last.fm (base des recommandations) :
      # plus long et plus stable, reconstruit le lundi et le vendredi matin, ou à la demande
      - name: Sync artist catalog
        if: github.event_name == 'schedule' || inputs.mode == 'manuel'
        run: npm run sync:artists

      # Appels Deezer relayés depuis Paris (fonction deezer-proxy) : sinon Deezer, qui voit un serveur aux États-Unis,
      # cache encore les sorties du jour. Sauf le lundi, où l'heure ne compte pas : environ 9 000 appels par synchro,
      # quota gratuit de 500 000 par mois.
      - name: Run sync script
        run: npm run sync:releases
        env:
          DEEZER_VIA_PARIS: ${{ (github.event_name == 'schedule' && steps.day.outputs.day == 'Mon') && '0' || '1' }}

      # Annonces sans fiche : dates approximatives MusicBrainz, et actus à valider (scripts/announcements.ts)
      - name: Sync announcements
        continue-on-error: true
        run: npx tsx scripts/announcements.ts

      # Auditeurs Last.fm (popularité toutes plateformes) : un lot d'artistes à chaque passage
      - name: Sync Last.fm listeners
        continue-on-error: true
        run: npm run sync:listeners

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Sync releases failed',
              body: `The releases sync workflow failed. Check the logs: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['bug', 'sync', 'automated']
            })
