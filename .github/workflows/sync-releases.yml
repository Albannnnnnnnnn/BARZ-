name: Sync Releases

on:
  schedule:
    # Tous les jours à 6h UTC (7h/8h en France) : les sorties de minuit
    - cron: '0 6 * * *'
    # Tous les jours à 18h UTC (19h/20h en France) : les sorties surprises de la journée
    - cron: '0 18 * * *'
  workflow_dispatch: # Permet lancement manuel (reconstruit aussi le catalogue)

permissions:
  contents: read
  issues: write

jobs:
  sync:
    name: Sync releases (Deezer + Spotify)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
      SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
      # Contact demandé par MusicBrainz (annonces de sorties à venir)
      MUSICBRAINZ_USER_AGENT: BARZ/1.0 (${{ secrets.MUSICBRAINZ_EMAIL || 'https://albannnnnnnnnn.github.io/BARZ-/' }})
      # Import Last.fm des membres (sync:artists) ; reste côté serveur
      LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Day of week
        id: day
        run: echo "day=$(date -u +%a)" >> "$GITHUB_OUTPUT"

      # Catalogue d'artistes, artistes similaires et import Last.fm (base des recommandations) :
      # plus long et plus stable, reconstruit le lundi et le vendredi matin, ou à la demande
      - name: Sync artist catalog
        if: github.event_name == 'workflow_dispatch' || (github.event.schedule == '0 6 * * *' && (contains(fromJSON('["Mon","Fri"]'), steps.day.outputs.day)))
        run: npm run sync:artists

      - name: Run sync script
        run: npm run sync:releases

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Sync releases failed',
              body: `The releases sync workflow failed. Check the logs: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['bug', 'sync', 'automated']
            })
