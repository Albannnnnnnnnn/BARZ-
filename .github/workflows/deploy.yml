name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  # Le site est statique : il faut le reconstruire pour afficher les sorties qui viennent d'être synchronisées
  # Après chaque synchro complète : nouvelles sorties + actus fraîches (lues au build).
  # Même si le sync échoue : les sorties déjà en base restent valables et les actus se rafraîchissent.
  # La veille de Supabase (fonction sync-fresh) lance aussi ce workflow (workflow_dispatch) quand elle trouve du nouveau.
  workflow_run:
    workflows: ['Sync Releases']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

jobs:
  build:
    name: Build Astro site
    runs-on: ubuntu-latest
    outputs:
      news_payload: ${{ steps.news.outputs.payload }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Facultatif : sans cette clé, la page Actus n'affiche pas de concerts
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          # Identifiant client Spotify (public) pour la connexion Spotify ; le secret n'est pas utilisé ici
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}

      # Nouvelle entrée dans les Nouveautés (src/lib/changelog.ts) ? Le message Discord est préparé ici, envoyé après le déploiement
      - name: Check news for Discord
        id: news
        continue-on-error: true
        run: node scripts/news-discord.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Salon #annonces du Discord de BARZ¡ (webhook dans le secret DISCORD_WEBHOOK_URL)
      - name: Announce on Discord
        if: needs.build.outputs.news_payload != ''
        continue-on-error: true
        env:
          PAYLOAD: ${{ needs.build.outputs.news_payload }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then echo "Pas de webhook Discord configuré."; exit 0; fi
          curl -fsS -H 'Content-Type: application/json' -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"
  # La notification du vendredi part de Supabase à 9h (supabase/friday-cron.sql), sans attendre ce workflow
